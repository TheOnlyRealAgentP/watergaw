[package]
name = "outflow-core"
version = "0.1.0"
edition = "2024"
description = "Outflow radar core: NEXRAD decoders and radar geometry, compiled to WebAssembly"
license = "MIT"
publish = false

[dependencies]
bzip2 = "0.6.1"

[dev-dependencies]
serde_json = "1.0.154"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
